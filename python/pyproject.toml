[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ynnpack-assets"
version = "0.1.0"
requires-python = ">=3.11"
description = "Independent checkpoint preparation for YNNPACK model experiments"
[project.optional-dependencies]
# The recorded recipe is tested with these versions. Select the appropriate
# official CPU/CUDA/ROCm wheel index when installing Torch.
qwen3 = ["torch==2.14.0", "torchao==0.18.0", "transformers==5.12.1", "numpy>=2,<3", "safetensors>=0.6,<1"]
test = ["numpy>=2,<3"]
[tool.setuptools.packages.find]
where = ["."]
include = ["ynnpack_assets*"]
